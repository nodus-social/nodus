# The single-origin Nodus lab. Every service is a container, so a test can
# restart one role without restarting the rest; Caddy is the only published
# port.
#
#   cp integration/.env.example integration/.env
#   # fill the three secrets, then:
#   docker compose -f integration/compose.yml up -d
#
# The build context is the superproject root: nodus-backend, web, sdk,
# server-sdk and recommender are one Cargo graph. The root .dockerignore keeps
# targets and node_modules out of it. Peer instances (Mastodon, Misskey) live
# in compose.peers.yml and join the same fixed network, `nodus-lab`, where this
# origin answers as https://nodus.test (443, for the peers) and as http on 8080
# (for the host browser only).
#
# The `:?` markers make compose fail early when .env is absent; up.sh fills the
# secrets on first run.

name: nodus-lab

x-nodus-environment: &nodus-environment
  NODUS_DOMAIN: ${NODUS_DOMAIN:-nodus.test}
  # Canonical identity: what peers are told to fetch, and what every
  # ActivityPub id and WebFinger alias is built from. It is the name Caddy
  # serves on 443, not the host's browser URL (see NODUS_HTTP_PORT).
  NODUS_BASE_URL: ${NODUS_BASE_URL:-https://nodus.test}
  NODUS_TITLE: ${NODUS_TITLE:-Nodus Lab}
  NODUS_DESCRIPTION: ${NODUS_DESCRIPTION:-Lab instance}
  NODUS_CONTACT_EMAIL: ${NODUS_CONTACT_EMAIL:-lab@nodus.test}
  NODUS_DATABASE_URL: >-
    postgres://nodus:${NODUS_DB_PASSWORD:?}@postgres:5432/nodus
  NODUS_DATABASE_CONNECTIONS: ${NODUS_DATABASE_CONNECTIONS:-10}
  NODUS_VALKEY_URL: >-
    redis://:${VALKEY_PASSWORD:?}@valkey:6379/0
  NODUS_AUTH_SECURE_COOKIES: ${NODUS_AUTH_SECURE_COOKIES:-false}
  NODUS_REGISTRATIONS_OPEN: ${NODUS_REGISTRATIONS_OPEN:-true}
  NODUS_AUTHORIZED_FETCH: ${NODUS_AUTHORIZED_FETCH:-false}
  NODUS_ACCOUNT_DELETE_GRACE_DAYS: ${NODUS_ACCOUNT_DELETE_GRACE_DAYS:-30}
  # Web Push needs a P-256 pair or the four subscription verbs answer 501 and
  # no browser can subscribe. These are LAB-ONLY keys: they are committed so a
  # fresh checkout can exercise push without a setup step, they are worthless
  # outside the lab (a real deployment must generate its own), and the public
  # half is what /api/v1/apps and /api/v1/push/subscription publish.
  NODUS_VAPID_PRIVATE_KEY: >-
    ${NODUS_VAPID_PRIVATE_KEY:-Gwf705zrqtxlBtjpVJFAidQwi3PLvQbP5csVLuAZ5IY}
  NODUS_VAPID_PUBLIC_KEY: >-
    ${NODUS_VAPID_PUBLIC_KEY:-BJTYVPjHzDziJ2DOO2AzghfD4Bmn_fgA9h_aKTuhr3ynEXKwbvq7vp7lrCbWTUlT1okxXp17yfS_FkNqaR57Jx8}
  NODUS_VAPID_SUBJECT: ${NODUS_VAPID_SUBJECT:-mailto:lab@nodus.test}
  # Bootstrap is deliberately not in this shared block: every role would race to
  # create the same admin on a fresh volume. Only nodus-api gets these three.
  NODUS_DRIVE_SHARE_SECRET: ${NODUS_DRIVE_SHARE_SECRET:-}
  NODUS_MEDIA_DIR: /var/lib/nodus/media
  NODUS_MEDIA_VARIANTS_DIR: /var/lib/nodus/media/variants
  NODUS_HOME_CAP: ${NODUS_HOME_CAP:-400}
  NODUS_HOME_SHARDS: ${NODUS_HOME_SHARDS:-1}
  NODUS_VALKEY_CHANNEL: ${NODUS_VALKEY_CHANNEL:-nodus:home}
  # Every outbound fetch goes to `https://<peer domain>`, which Caddy
  # terminates with its internal CA. reqwest's platform verifier is
  # rustls-native-certs, so this file is the whole root store:
  # nodus-ca-entrypoint.sh writes the image's bundle plus the lab root.
  SSL_CERT_FILE: /tmp/nodus-lab-ca-bundle.crt

x-nodus-service: &nodus-service
  image: nodus-lab/server:0.1.0
  build:
    # scripts/build.sh materialises the pinned submodule commits here; the
    # Dockerfile lands next to the tree it copies. LAB_BUILD_FROM_WORKTREE=1
    # points this at the superproject root instead.
    context: ${NODUS_BUILD_CONTEXT:-./volumes/build-context}
    dockerfile: ${NODUS_DOCKERFILE:-Dockerfile.server}
  restart: unless-stopped
  # tini stays PID 1; the wrapper appends Caddy's internal root to the image's
  # bundle and then execs the role binary. Every role in this block makes
  # outbound http requests (the API to peers, media to its own endpoint, the
  # workers to the store), so all of them need the same trust rather than
  # only the API.
  entrypoint: ["/usr/bin/tini", "--", "/opt/nodus/bin/lab-ca-entrypoint.sh"]
  environment: *nodus-environment
  volumes:
    - nodus-data:/var/lib/nodus
    # Generated per stack by scripts/ca.sh, never committed: caddy mints a new
    # authority whenever reset.sh drops nodus-data, so this file follows it.
    - ./state/ca/nodus-lab-ca.crt:/certs/nodus-lab-ca.crt:ro
    - ./peers/ca/nodus-ca-entrypoint.sh:/opt/nodus/bin/lab-ca-entrypoint.sh:ro
  depends_on:
    postgres:
      condition: service_healthy
    valkey:
      condition: service_healthy

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: nodus-lab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: postgres
      NODUS_DB_PASSWORD: ${NODUS_DB_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nodus -d nodus"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    # No host port: a development cluster here already publishes 5432, and
    # the lab must stay reachable only through Caddy and the compose network.
    expose:
      - "5432"

  valkey:
    image: valkey/valkey:8.1-bookworm
    container_name: nodus-lab-valkey
    restart: unless-stopped
    command:
      - valkey-server
      - --requirepass
      - ${VALKEY_PASSWORD:?}
      - --save
      - ""
      - --appendonly
      - "no"
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          valkey-cli --no-auth-warning -a "$${VALKEY_PASSWORD}" ping
          | grep -q PONG
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s
    expose:
      - "6379"

  nodus-api:
    <<: *nodus-service
    container_name: nodus-lab-api
    command: ["nodus-api"]
    environment:
      <<: *nodus-environment
      NODUS_BIND: 0.0.0.0:3000
      NODUS_NODE_NAME: api-1
      # Only the API bootstraps the admin; a second role doing it at the same
      # moment trips account_local_username_idx on a fresh volume.
      NODUS_BOOTSTRAP_EMAIL: ${NODUS_BOOTSTRAP_EMAIL:-admin@nodus.test}
      NODUS_BOOTSTRAP_USERNAME: ${NODUS_BOOTSTRAP_USERNAME:-admin}
      NODUS_BOOTSTRAP_PASSWORD: ${NODUS_BOOTSTRAP_PASSWORD:?}
      # The admin topology view reads these once at boot. They are the compose
      # service names, which resolve inside the `nodus-lab` network.
      NODUS_TELEMETRY: >-
        media=http://nodus-media-worker:3003,feed=http://nodus-feed:3000,scan=http://nodus-scan:3000,prune=http://nodus-prune:3000,calc=http://nodus-calc:3000
      # Lab-only escape hatch, empty in this lab now that both peers answer
      # https on 443 through Caddy. It names the hosts the API may also reach
      # over plain `http`; TLS is skipped for exactly those names. Production
      # must not set this — a production instance federates over https.
      NODUS_ALLOW_INSECURE_PEERS: ${NODUS_ALLOW_INSECURE_PEERS:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  nodus-media-worker:
    <<: *nodus-service
    container_name: nodus-lab-media-worker
    command: ["nodus-media"]
    environment:
      <<: *nodus-environment
      NODUS_BIND: 0.0.0.0:3003
      NODUS_MEDIA_NODE: media-1
      # Media URLs are built from this endpoint, so it names the canonical
      # origin, not the host's browser port.
      NODUS_MEDIA_ENDPOINT: https://nodus.test
    healthcheck:
      # The media role serves bytes, not /healthz: a 200 on the built-in avatar
      # proves the router is up without touching the catalogue.
      test:
        - CMD-SHELL
        - >-
          curl -fsS -o /dev/null
          http://127.0.0.1:3003/media/default-avatar.png
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  nodus-feed:
    <<: *nodus-service
    container_name: nodus-lab-feed
    command: ["nodus-feed"]
    environment:
      <<: *nodus-environment
      NODUS_BIND: 0.0.0.0:3000
    healthcheck:
      # The engine has no /healthz; /api/v1/meta is the cheapest route it owns
      # and answers 200 without a session.
      test:
        - CMD-SHELL
        - >-
          curl -fsS -o /dev/null
          http://127.0.0.1:3000/api/v1/meta
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # scan, prune and calc are workers: their only listener is the gRPC control
  # port, which no shell utility in the slim image can probe. They carry no
  # healthcheck on purpose; a crashed worker exits and `restart` brings it back,
  # and nothing on the request path waits for them.
  nodus-scan:
    <<: *nodus-service
    container_name: nodus-lab-scan
    command: ["nodus-scan"]
    environment:
      <<: *nodus-environment
      NODUS_TELEMETRY_BIND: 0.0.0.0:3000

  nodus-prune:
    <<: *nodus-service
    container_name: nodus-lab-prune
    command: ["nodus-prune"]
    environment:
      <<: *nodus-environment
      NODUS_TELEMETRY_BIND: 0.0.0.0:3000

  nodus-calc:
    <<: *nodus-service
    container_name: nodus-lab-calc
    command: ["nodus-calc"]
    environment:
      <<: *nodus-environment
      NODUS_TELEMETRY_BIND: 0.0.0.0:3000
      # calc opens the tokens the feed engine sealed; no key, no start.
      TOKEN_ENC_KEY: ${TOKEN_ENC_KEY:?}
  nodus-web:
    image: nodus-lab/web:0.1.0
    build:
      context: ${NODUS_BUILD_CONTEXT:-./volumes/build-context}
      dockerfile: ${NODUS_DOCKERFILE_WEB:-Dockerfile.web}
    container_name: nodus-lab-web
    restart: unless-stopped
    command: ["nodus-web-server"]
    # `local_read` (crates/web-server/src/public_api.rs) answers an anonymous
    # permalink from this origin's own store by fetching
    # `https://<instance host>/api/v1/...` with the SSRF-hardened client. That
    # name resolves to a private address inside the lab and is signed by Caddy's
    # internal CA, so the shell needs the same two things every server role has
    # (x-nodus-service): the instance host it answers as, which is also what
    # trusts the private address (validate.rs, `configured_trusted_private_hosts`),
    # and the lab root appended to the image's store. Without them the self-read
    # is refused and the proxy falls back to the peer, which is the 502.
    #
    # The signed-in path does not use `local_read`: the session token makes the
    # proxy relay to the peer itself (`https://mastodon.test`), and the same
    # guard refuses that host unless it is trusted too. That list lives in
    # compose.peers.yml, but scripts/common.sh's `compose()` passes this file
    # alone, so `up.sh` or any `compose up nodus-web` recreated the container
    # without it and every signed-in permalink answered 502. The web block is
    # therefore complete here: NODUS_ALLOW_PRIVATE_HOSTS mirrors nodus-api's
    # value in compose.peers.yml (which overrides it when the peers are up).
    # `nodus.test` needs no entry: NODUS_INSTANCE_HOST already trusts it.
    entrypoint: ["/usr/bin/tini", "--", "/opt/nodus/bin/lab-ca-entrypoint.sh"]
    environment:
      # The shell reads no instance config: it renders pages and proxies session
      # state. NODUS_SESSIONS lives on the shared volume so a restart keeps it.
      NODUS_LISTEN: 0.0.0.0:3000
      NODUS_ASSET_DIR: /srv/nodus
      NODUS_SESSIONS: /var/lib/nodus/sessions.json
      NODUS_INSTANCE_HOST: ${NODUS_DOMAIN:-nodus.test}
      NODUS_ALLOW_PRIVATE_HOSTS: mastodon.test,misskey.test,mastodon,misskey
      SSL_CERT_FILE: /tmp/nodus-lab-ca-bundle.crt
    volumes:
      - nodus-data:/var/lib/nodus
      - ./state/ca/nodus-lab-ca.crt:/certs/nodus-lab-ca.crt:ro
      - ./peers/ca/nodus-ca-entrypoint.sh:/opt/nodus/bin/lab-ca-entrypoint.sh:ro
    depends_on:
      nodus-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    expose:
      - "3000"

  caddy:
    image: nodus-lab/web:0.1.0
    build:
      context: ${NODUS_BUILD_CONTEXT:-./volumes/build-context}
      dockerfile: ${NODUS_DOCKERFILE_WEB:-Dockerfile.web}
    container_name: nodus-lab-caddy
    restart: unless-stopped
    # The image's nodus user owns /var/lib/nodus at build time, but the shared
    # `nodus-data` volume is created and populated by whichever role comes up
    # first, and in this lab that is the server image's uid 10001. Caddy keeps
    # its PKI under /var/lib/nodus/caddy (the Caddyfile's `storage`), so a fixed
    # unprivileged uid cannot write there; root is what the upstream caddy image
    # uses as well, and this is the only container that needs a privileged port.
    user: "0:0"
    command:
      - caddy
      - run
      - --config
      - /etc/caddy/Caddyfile
      - --adapter
      - caddyfile
    # integration/ is outside the root build context (.dockerignore), so the
    # route table is mounted rather than baked. Editing it is a restart.
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - nodus-data:/var/lib/nodus
    ports:
      - "${NODUS_HTTP_PORT:-8080}:8080"
      # The canonical origin is https://nodus.test, and the host browser reaches
      # it through this mapping because host 443 already belongs to something
      # else. The Playwright config maps `nodus.test:443` to the same port; keep
      # LAB_HTTPS_PORT in step with NODUS_HTTPS_PORT.
      - "${NODUS_HTTPS_PORT:-18443}:443"
    # 443 still has to be open on the container's own interface for the peers,
    # which resolve the network aliases below and dial https on 443 inside
    # `nodus-lab` (optionally through a host_nat loop that publishes it above).
    expose:
      - "443"
    networks:
      default:
        aliases:
          # The identity NODUS_BASE_URL advertises, and the name peers resolve.
          # It has to be the dotted name: an ActivityPub origin is a host name,
          # and the API rejects a single-label one (crates/api activitypub.rs,
          # `is_disallowed_domain`) before a peer's WebFinger reaches it.
          - nodus.test
          # The peer names, served here and proxied to the peer containers by
          # the two site blocks at the end of the Caddyfile. Caddy owns these
          # names so that `<name>:443` is unambiguous on the network: a peer
          # container must not also answer to its own advertised name, or
          # Docker's DNS would hand out two addresses for it.
          - mastodon.test
          - misskey.test
    depends_on:
      nodus-api:
        condition: service_healthy
      nodus-web:
        condition: service_healthy
      nodus-media-worker:
        condition: service_healthy
      nodus-feed:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  postgres-data:
  nodus-data:

networks:
  default:
    # Fixed so compose.peers.yml can attach Mastodon and Misskey to the same
    # network without knowing this project's directory name.
    name: nodus-lab
