# AIO listener: the same routing the reference deployment puts in front of the instance,
# so a single container serves the client bundle, the shell and the API on one origin.
#
# Regular-expression locations are matched in the order they appear, so the two that pick a
# process are written before the asset rule and before the prefix locations.
worker_processes 1;
daemon off;
pid /run/nginx.pid;
error_log /dev/stderr warn;

# The services own their sockets and run as `nodus`, so the workers that dial them must be
# that user too; the master keeps root only to start them and to bind the port.
user nodus;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    # /var/lib/nodus belongs to the worker user; nginx cannot create these under /var/lib.
    client_body_temp_path /var/lib/nodus/nginx/body;
    proxy_temp_path /var/lib/nodus/nginx/proxy;
    fastcgi_temp_path /var/lib/nodus/nginx/fastcgi;
    uwsgi_temp_path /var/lib/nodus/nginx/uwsgi;
    scgi_temp_path /var/lib/nodus/nginx/scgi;
    default_type application/octet-stream;
    access_log /dev/stdout;
    client_max_body_size 64m;
    sendfile on;
    tcp_nopush on;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 5;

    # Both processes listen on a socket in the shared run directory: no port inside the
    # container is reachable except this one, which the ingress answers.
    upstream backend {
        server unix:/var/run/app/api.sock;
    }

    upstream shell {
        server unix:/var/run/app/shell.sock;
    }

    server {
        listen 8080;
        server_name _;

        # The session is the shell's own state.
        location ~ ^/api/session {
            proxy_pass http://shell;
            proxy_set_header Host $host;
        }

        # The OAuth callback is a page in the app: the code is exchanged client-side.
        location ~ ^/oauth/callback {
            proxy_pass http://shell;
            proxy_set_header Host $host;
        }

        # The instance's own icon and thumbnail, which the server renders rather than the
        # bundle; the asset rule below would look for them inside /srv/nodus.
        location ~ ^/(icon\.svg|icon\.png|favicon\.ico|media/thumbnail\.png)$ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        location ~ ^/(oauth|auth|users|inbox|statuses|media|\.well-known|api)/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Hashed bundles never change.
        location ~* \.(js|wasm|css|png|jpg|jpeg|svg|ico|webp|woff2?|map)$ {
            root /srv/nodus;
            add_header Cache-Control "public, max-age=31536000, immutable";
            types {
                application/wasm wasm;
            }
        }

        location = /healthz {
            proxy_pass http://backend;
        }

        location = /readyz {
            proxy_pass http://backend;
        }

        location ^~ /public-api/ {
            proxy_pass http://shell;
            proxy_set_header Host $host;
        }

        # Page routes are server-rendered; the app decides what to draw.
        location / {
            proxy_pass http://shell;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            add_header Cache-Control "no-store";
        }
    }
}
