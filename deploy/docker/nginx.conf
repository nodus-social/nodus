# AIO listener: the same routing the reference deployment puts in front of the instance,
# so a single container serves the client bundle, the shell and the API on one origin.
#
# Regular-expression locations are matched in the order they appear, so the two that pick a
# process are written before the asset rule and before the prefix locations.
worker_processes 1;
daemon off;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    client_max_body_size 64m;
    sendfile on;
    tcp_nopush on;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 5;

    upstream backend {
        server 127.0.0.1:3001;
    }

    upstream shell {
        server 127.0.0.1:3002;
    }

    server {
        listen 8080;
        server_name _;

        # The session is the shell's own state.
        location ~ ^/api/session {
            proxy_pass http://shell;
            proxy_set_header Host $host;
        }

        # The OAuth callback is a page in the app: the code is exchanged client-side.
        location ~ ^/oauth/callback {
            proxy_pass http://shell;
            proxy_set_header Host $host;
        }

        location ~ ^/(oauth|auth|users|inbox|statuses|media|\.well-known|api)/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Hashed bundles never change.
        location ~* \.(js|wasm|css|png|jpg|jpeg|svg|ico|webp|woff2?|map)$ {
            root /srv/nodus;
            add_header Cache-Control "public, max-age=31536000, immutable";
            types {
                application/wasm wasm;
            }
        }

        location = /healthz {
            proxy_pass http://backend;
        }

        location = /readyz {
            proxy_pass http://backend;
        }

        location ^~ /public-api/ {
            proxy_pass http://shell;
            proxy_set_header Host $host;
        }

        # Page routes are server-rendered; the app decides what to draw.
        location / {
            proxy_pass http://shell;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            add_header Cache-Control "no-store";
        }
    }
}
